# Une alerte = un nom + l'URL d'une recherche vinted.fr.
#
# Pour en ajouter une :
#   1. va sur vinted.fr, fais ta recherche et pose tes filtres (marque,
#      taille, couleur, prix, état, matière... — tout est supporté) ;
#   2. copie l'URL de la barre d'adresse ;
#   3. lance :  python add_alert.py "<url>" --name mon_alerte
#
# add_alert.py affiche d'abord un aperçu des articles qui correspondent,
# pour vérifier le filtre avant de l'enregistrer. Tous les filtres de
# l'URL sont appliqués par Vinted côté serveur : ce que tu vois sur le
# site est exactement ce que l'alerte surveillera.
#
# Pour supprimer une alerte : efface son bloc (les 2 lignes) ci-dessous.
# Dans tous les cas, un `git push` est nécessaire pour que GitHub Actions
# prenne le changement en compte.

searches:
  - name: sebago_classic_dan
    url: "https://www.vinted.fr/catalog?search_text=classic+dan&brand_ids[]=20413&size_ids[]=787&color_ids[]=1&price_to=200"
  - name: hast
    url: "https://www.vinted.fr/catalog?search_text=hast&price_to=150.00&currency=EUR&brand_ids[]=277467&size_ids[]=208&size_ids[]=209&size_ids[]=1426&size_ids[]=1438&size_ids[]=1524&size_ids[]=1531&size_ids[]=1596&size_ids[]=1638&status_ids[]=1&status_ids[]=2&status_ids[]=6&search_id=28633997365&order=newest_first"
