# Liste de recherches. Chaque recherche : query texte (passé à la recherche
# Vinted), et des filtres appliqués ensuite sur les résultats :
#   price_max : prix max déclencheur (obligatoire, aussi utilisé comme
#               plafond de la recherche Vinted elle-même)
#   brand     : nom de marque exact (comparaison insensible à la casse)
#   sizes     : liste de tailles exactes telles qu'affichées par Vinted
#               (ex: "43,5", "38", "M") — aucun filtre si omis
#   colors    : liste de couleurs (sous-chaîne, insensible à la casse,
#               matchée contre le champ Couleur de la fiche article —
#               coûte une requête HTTP supplémentaire par article candidat,
#               uniquement appliqué aux articles qui passent déjà
#               price_max/brand/sizes) — aucun filtre si omis
#   catalog_ids : catégories Vinted à restreindre (optionnel)

searches:
  - name: sebago_classic_dan
    query: sebago classic dan
    price_max: 200
    brand: Sebago
    sizes: ["43,5"]
    colors: ["noir"]
