# Liste de recherches. Chaque recherche : query texte, prix max, catégories
# Vinted (catalog_ids) à whitelister, et un seuil de score minimum (0-100)
# en dessous duquel l'article n'est pas notifié.
#
# Whitelists Vinted FR (héritage parent → enfants confirmé) :
#   MIXTE = [4, 16, 19, 1187, 2050, 1231, 82]
#     Vêtements F + Chaussures F + Sacs F + Accessoires F
#     + Vêtements H + Chaussures H + Accessoires H (inclut Sacs H)
#   FEMME = [4, 16, 19, 1187]
#   CHAUSSURES_UNISEX = [16, 1231]
#   SACS À MAIN uniquement = [156]

searches:
  - name: patagonia
    query: patagonia
    price_max: 50
    min_score: 70
    catalog_ids: [4, 16, 19, 1187, 2050, 1231, 82]

  - name: salomon_chaussures
    query: salomon
    price_max: 60
    catalog_ids: [16, 1231]
    min_score: 70

  - name: ralph_lauren_polo
    query: ralph lauren polo
    price_max: 15
    min_score: 70
    catalog_ids: [4, 16, 19, 1187, 2050, 1231, 82]

